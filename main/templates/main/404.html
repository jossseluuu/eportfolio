{% extends "main/base.html" %}

{% block title %}404 · {{ profile.name }}{% endblock %}

{% block content %}
<section class="hero not-found">
  <div class="hero-spot" aria-hidden="true"></div>
  <div class="container hero-inner">
    <p class="pill"><span class="pill-dot" aria-hidden="true"></span>HTTP 404</p>
    <h1 class="hero-name"><span class="hero-line hero-line-outline">404</span></h1>
    <p class="hero-intro">{{ ui.not_found_title }}. {{ ui.not_found_text }}</p>
    <p class="hero-intro muted" lang="es">{{ es_ui.not_found_title }}. {{ es_ui.not_found_text }}</p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="{{ home_url }}">{{ ui.go_home }} <span aria-hidden="true">→</span></a>
      <a class="btn btn-ghost" href="{{ es_home_url }}" lang="es">{{ es_ui.go_home }}</a>
    </div>
  </div>
</section>
{% endblock %}
